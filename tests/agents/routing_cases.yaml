  - { message: "Read what the error dialog on my screen says", expect: app_automation }
  - { message: "Click the Save button in my Notepad window", expect: app_automation }
  - { message: "Type 'meeting at 3pm' into the open Notepad window", expect: app_automation }
  - { message: "Press Enter in the Calculator window", expect: app_automation }
  - { message: "Fill in the name box in the invoice program that is open", expect: app_automation }

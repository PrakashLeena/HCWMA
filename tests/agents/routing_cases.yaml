  - { message: "Send myself a reminder email about the dentist", expect: communication }
  - { message: "Check my inbox for anything from the school", expect: communication }
  - { message: "Did the airline email me my booking confirmation?", expect: communication }
  - { message: "Reply to Maria's email and say thanks", expect: communication }

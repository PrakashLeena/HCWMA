  - { message: "Click OK in the dialog that just popped up", expect: app_automation }
  - { message: "Press Tab and then Enter in the settings form of my accounting app", expect: app_automation }
  # near misses: sound like clicking or typing, but are another agent's job
  - { message: "Write a Python script that clicks a button on my screen every minute", expect: coding, must_not: app_automation }
  - { message: "My button click handler throws a NullPointerException, fix it", expect: debugging, must_not: app_automation }
  - { message: "Find the notes file I typed into yesterday", expect: file_system, must_not: app_automation }
  - { message: "Resize my screenshot of the dialog to 800 pixels wide", expect: image_editing, must_not: app_automation }
  - { message: "Remember that I like my programs in dark mode", expect: memory_librarian, must_not: app_automation }

  # --- memory_librarian ---
  - { message: "Remember that my sister's birthday is on 12 March", expect: memory_librarian }

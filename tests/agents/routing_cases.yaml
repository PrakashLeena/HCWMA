  - { message: "Open notes.txt and summarize", expect: documents_study }
  - { message: "Read thesis-draft.pdf and give me the key points", expect: documents_study }
  - { message: "Show me what is in readme.md", expect: documents_study }
  - { message: "Make five quiz questions from biology-notes.docx", expect: documents_study }

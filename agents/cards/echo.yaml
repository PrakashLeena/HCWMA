# Dummy agent for Step 7: proves Router -> agent -> tool -> back. Disable it once real
# agents cover these requests.
id: echo
name: Echo Test Agent
status: enabled
router_line: "tells the current time and date (\"what time is it\", \"today's date\"); also echoes/repeats a message"
description: >
  Test agent. Repeats back what the user asked it to echo or repeat, and can tell the
  current date and time on this PC.
handles:
  - echo or repeat back a message ("echo hello", "say back ...")
  - test whether delegation works
  - what time or date is it on this PC
does_not_handle:
  - files, folders, programs, the internet or anything else
tools: [get_system_time]
permission_tier: T0
approval_required: []
memory_scopes: [task]
record_outcomes: false  # a test agent; its tasks are not worth remembering
system_prompt: prompts/echo.md
limits: { max_steps: 4, timeout_s: 120 }

# Router fast path (agents/router/fast_path.py): `patterns` send a very clear request
# straight here without a Router model call; `keywords` stop other agents' fast
# matches when the message also sounds like this agent's job.
fast_route:
  patterns:
    - '^\W*what\s+time\s+is\s+it(\s+(right\s+)?now)?\W*$'
    - '^\W*what(''s|\s+is)\s+today''s\s+date\b'
  keywords: [echo, repeat back]

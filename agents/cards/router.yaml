id: router
name: Router
kind: router
status: enabled
description: >
  Understands the request, picks the sub-agent, delegates, collects the result and asks a
  clarifying question when unsure. Has no file, shell or network tools (rule 2).
handles: []
does_not_handle:
  - any work that needs tools (delegated instead)
tools: []
permission_tier: T0
approval_required: []
# Memory policy 5: the Router reads profile/preferences and recent summaries only.
memory_scopes: [profile, summaries, task]
system_prompt: prompts/router.md
limits: { max_steps: 1, timeout_s: 60 }

# Live facts NO agent can check: if the model Router tries to answer one, it says it cannot
# check it instead (owner decision 2026-11-20).
live_facts:
  - '\b(weather|forecast|temperature\s+outside|news|headlines|stock|share\s+price|exchange\s+rate|bitcoin|score)\b'
  - '\b(ram|cpu|memory)\s+(usage|use|load)\b'

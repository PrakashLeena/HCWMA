# Communication agent (build step 15; master document 4.3, 4.4, 9.2, 11).
# First adapter: Gmail, through the official Gmail API (OAuth desktop login, token in the OS
# credential store). Searches and reads mail (T1), saves drafts (T2) and sends mail (T3: the
# owner approves EVERY send and sees recipient, subject and the full text). Email text is
# data (rule 13): a recipient must be an address the owner typed, so mail cannot make it
# send anywhere. Second adapter (2026-11-19): WhatsApp Desktop through UI Automation: list
# visible chats, read ONE chat the owner named, send ONE message to a chat the owner named (T3,
# approval every time; the open chat's header is checked before Enter). Outlook comes later.
# Draft by Claude Code on 2026-11-19 — owner to review.
id: communication
name: Communication Agent
status: enabled
router_line: "my Gmail/email and WhatsApp: search/read/summarize emails, draft or send an email; list WhatsApp chats, read a chat I name, send one WhatsApp message (sends ask me first); no deleting; not Outlook"
description: >
  Works with the owner's Gmail and WhatsApp Desktop: finds and reads emails, summarizes them,
  saves drafts and, only after the owner approves each one, sends an email; lists WhatsApp
  chats, reads a chat the owner named and sends one WhatsApp message (approved each time) to a
  chat the owner named. It cannot delete, change settings or read contacts.
handles:
  - read my latest email
  - search my Gmail for messages from someone or about something
  - summarize an email
  - draft an email to an address I give
  - send an email to an address I give (I approve it first)
  - send myself a reminder email
  - list my WhatsApp chats
  - read my WhatsApp chat with someone I name
  - send a WhatsApp message to a chat I name (I approve it first)
does_not_handle:
  - deleting, archiving or labelling emails
  - Outlook, SMS, Telegram or other messengers (not built yet)
  - WhatsApp to many people, scheduled or automatic messages
  - web pages and websites (→ web_research)
  - files on this PC, even if they are called email or message (→ file_system)
  - clicking in a mail program window (→ app_automation)
tools:
  - search_messages
  - read_message
  - draft_message
  - send_message
  - whatsapp_list_chats
  - whatsapp_read_chat
  - whatsapp_send
permission_tier: T3
approval_required: [send_message, whatsapp_send]
# The send tools are offered to the model only when the request itself says send/reply/tell...
change_words: [send, forward, reply, respond, tell, text]
memory_scopes: []
system_prompt: prompts/communication.md
limits: { max_steps: 6, timeout_s: 600 }

# Router fast path (agents/router/fast_path.py): `patterns` send a very clear request
# straight here without a Router model call; `keywords` stop other agents' fast
# matches when the message also sounds like this agent's job.
fast_route:
  patterns:
    - '^(?!.*\b(pages?|sites?|websites?|web|https?|www)\b).*(?<![@.\w])gmail(?!\.\w)'
    - '^(?=.*\b(read|check|show|search|find|open|summari[sz]e|list)\b)(?=.*\b(e-?mails?|inbox)\b)(?!.*\b(files?|folders?|attachments?)\b)(?!.*\b\w+\.(txt|docx?|pdf|xlsx?|csv|md|py|png|jpe?g)\b)'
    - '^(?=.*\b(draft|compose|send|write)\b)(?=.*\be-?mails?\b)(?=.*@)'
    - '^(?!.*\b(pages?|sites?|websites?|web|https?|www|files?|folders?|scripts?|code|program)\b).*\bwhats\s?app\b'
  keywords: [email, emails, e-mail, gmail, inbox, mail, whatsapp]

# Answers must come from a successful tool call; otherwise the runtime refuses the answer
# instead of passing it on as fact (owner decision 2026-11-20).
requires_tool: true

# Live facts only this agent can check: a model-Router answer to such a question is sent here
# instead (owner decision 2026-11-20).
live_facts:
  - '\b(e-?mails?|inbox|gmail|whatsapp)\b'
  - '\b(unread|latest|last|new)\s+messages?\b'

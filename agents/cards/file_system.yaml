# File & System agent (build steps 8 and 9; master document 4.3, 4.4, 4.6).
# Step 9 added restore_file, move_file (T3) and delete_file (T4). The tier is T4 so that
# delete_file is on the card at all; every one of the three stops at the owner's approval
# prompt before it runs, and delete only ever moves a file to the Recycle Bin.
# Draft by Claude Code on 2026-11-17 — owner to review.
id: file_system
name: File & System Agent
status: enabled
router_line: "find or lost files, recent changes, Recycle Bin restore, move/delete, disk or free space; not file contents, not downloads"
description: >
  Finds files and folders on this PC, reports on disk space, and can restore a file from the Recycle
  Bin, move or rename a file, or delete a file (to the Recycle Bin). Handles "I lost a
  file", "where is X", "what did I change recently", "is it in the Recycle Bin", "restore
  it", "move this file", "delete this file", "what is using my disk". Changes are made only
  after the owner approves each one.
handles:
  - missing or lost file
  - find a file by name, type or date
  - find a folder by name
  - files changed or created recently
  - check whether a deleted file is in the Recycle Bin
  - restore a deleted file from the Recycle Bin
  - move or rename a file
  - delete a file (it goes to the Recycle Bin)
  - disk usage, free space, largest files and folders
does_not_handle:
  - reading, summarizing or editing what is inside a file (→ coding / documents)
  - moving, deleting or restoring whole folders or many files at once, or emptying the Recycle Bin
  - the current time or date (→ echo)
  - anything on the internet
tools:
  - search_files
  - list_recent_files
  - check_recycle_bin
  - get_disk_usage
  - restore_file
  - move_file
  - delete_file
permission_tier: T4
approval_required: [restore_file, move_file, delete_file]
# Step 10: past task outcomes and the owner's stated facts ("my projects live in ..."),
# master document 4.6 step 2.
memory_scopes: [pc_index, profile, episodic, task]
# Only the owner's own facts ("my projects live in ...", master document 4.6 step 2) go into
# the prompt; past task summaries do not help find a file and cost CPU reading time.
prompt_memory_scopes: [profile, pc_index]
# A successful lookup with results is answered by code, without a second model call. Not when
# nothing was found (the model checks the Recycle Bin / says what to try) or when the owner
# asks for a change (the model must propose restore/move/delete, which the owner approves).
direct_answer_tools: [search_files, list_recent_files, check_recycle_bin, get_disk_usage]
# restore_file, move_file and delete_file are offered only when the request uses one of these
# words; a plain "find" request gets the four read-only tools (a shorter prompt).
change_words: [restore, recover, undelete, "put back", "bring back", move, rename, delete, remove, trash, erase, "get rid of"]
system_prompt: prompts/file_system.md
limits: { max_steps: 6, timeout_s: 420 }

# Router fast path (agents/router/fast_path.py): `patterns` send a very clear request
# straight here without a Router model call; `keywords` stop other agents' fast
# matches when the message also sounds like this agent's job.
fast_route:
  patterns:
    # a find word AND "file(s)" / "folder(s)", but not "that file" / "this folder" (those need
    # the conversation, which only the model Router reads)
    - '^(?=.*\b(find|locate|missing|lost|where\s+is)\b)(?=.*\b(files?|folders?)\b)(?!.*\b(that|this|these|those|it|same)\s+(files?|folders?)\b)'
  keywords: [file, files, folder, folders, recycle bin, disk, drive, restore, rename, delete]

# Answers must come from a successful tool call; otherwise the runtime refuses the answer
# instead of passing it on as fact (owner decision 2026-11-20).
requires_tool: true

# Live facts only this agent can check: a model-Router answer to such a question is sent here
# instead (owner decision 2026-11-20).
live_facts:
  - '\b(files?|folders?|recycle\s+bin)\b'
  - '\b(free|disk|drive)\s+space\b|\bhow\s+much\s+space\b|\b[A-Z]:\s*drive\b'

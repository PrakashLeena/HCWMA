# File & System agent (build step 8; master document 4.3, 4.4, 4.6).
# Read-only in this step: restore_file, move_file and delete_file arrive with the approval
# workflow in Step 9 and will be listed under approval_required then.
# Draft by Claude Code on 2026-11-17 — owner to review.
id: file_system
name: File & System Agent
status: enabled
description: >
  Finds files on this PC and reports on disk space. Handles "I lost a file", "where is X",
  "what did I change recently", "is it in the Recycle Bin", "what is using my disk".
  Read-only: it looks and reports, it does not open, change, move, restore or delete files.
handles:
  - missing or lost file
  - find a file by name, type or date
  - files changed or created recently
  - check whether a deleted file is in the Recycle Bin
  - disk usage, free space, largest files and folders
does_not_handle:
  - reading, summarizing or editing what is inside a file (→ coding / documents)
  - restoring, moving, renaming or deleting files (not available yet)
  - the current time or date (→ echo)
  - anything on the internet
tools: [search_files, list_recent_files, check_recycle_bin, get_disk_usage]
permission_tier: T1
approval_required: []
memory_scopes: [pc_index, task]
system_prompt: prompts/file_system.md
limits: { max_steps: 6, timeout_s: 420 }

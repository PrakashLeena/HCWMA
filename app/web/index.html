<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HCWMA</title>
  <link rel="stylesheet" href="/static/chat.css">
</head>
<body>
  <header>
    <h1>HCWMA</h1>
    <span id="status" class="status">checking…</span>
    <a class="link" href="/status" title="Ollama, model, RAM, disk, Gmail, WhatsApp, backups">Health</a>
    <a class="link" href="/tools" title="Review tools written by the Tool Builder">Tools</a>
    <button id="forget" type="button" class="link" hidden>Forget token</button>
    <button id="stop" type="button" class="danger" hidden
            title="Halt every agent and withdraw every approval prompt">Stop everything</button>
  </header>

  <main id="messages" aria-live="polite"></main>

  <section id="approvals" class="panel" aria-live="assertive" hidden></section>

  <form id="token-form" class="panel" hidden>
    <label for="token-input">API token</label>
    <p class="hint">Run <code>python -m backend.auth.token</code> in the project folder and paste
      the result here. It is kept only until you close this tab.</p>
    <div class="row">
      <input id="token-input" type="password" autocomplete="off" spellcheck="false" required>
      <button type="submit">Unlock</button>
    </div>
  </form>

  <form id="chat-form" class="panel" hidden>
    <div class="row">
      <textarea id="chat-input" rows="2" placeholder="Message HCWMA (Enter to send, Shift+Enter for a new line)" required></textarea>
      <button id="send" type="submit">Send</button>
    </div>
    <div id="voice-row" class="row voice" hidden>
      <button id="talk" type="button" class="talk"
              title="Hold to talk; release to send. Hotkey: hold F9. Approvals are never given by voice.">Hold to talk (F9)</button>
      <label for="voice-lang" class="voice-label">Language</label>
      <select id="voice-lang">
        <option value="en">English</option>
        <option value="ta">Tamil (experimental)</option>
        <option value="si">Sinhala (experimental)</option>
      </select>
      <span id="voice-state" class="voice-state"></span>
    </div>
  </form>

  <script src="/static/chat.js"></script>
</body>
</html>

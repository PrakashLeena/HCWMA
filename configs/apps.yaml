# The owner's app overrides (launch_app; owner decisions 2026-11-20 and 2026-11-21,
# docs/DECISIONS.md).
#
# Since 2026-11-21 HCWMA can open ANY app found on this PC (the app catalog, scanned at start
# and daily); an app the owner has not allowed shows "Allow once / Always allow / Deny" first,
# and "Always allow" choices are kept per PC in %LOCALAPPDATA%\HCWMA, not here.
#
# An entry here is the owner's own override: it opens WITHOUT a card, it is pinned to its
# package + publisher (a look-alike shortcut is never started), and it can set how to recognise
# a running copy and how long to wait. Off-limits apps are dropped when this list is read,
# whatever is written here: web browsers, password managers, banking and payment apps,
# terminals / code editors / anything that runs commands, system tools, app stores and
# installers, and HCWMA itself (integrations/apps/blocklist.py).
#
#   id             short name used in code
#   name, aliases  what the owner may call it ("open WhatsApp")
#   app_id_prefix  start of the AppUserModelID (Get-StartApps): package name + publisher id
#   processes      process names of a running copy (without .exe)
#   wait_s         how long to wait after opening it (default 30, at most 90); one attempt only
apps:
  # Used by the WhatsApp adapter to open WhatsApp Desktop when it is closed.
  - id: whatsapp
    name: WhatsApp
    aliases: [whatsapp desktop, whats app]
    app_id_prefix: 5319275A.WhatsAppDesktop_cv1g1gvanyjgm
    processes: [whatsapp.root, whatsapp]
    # Measured 2026-11-20 on this PC: WhatsApp shows its loading splash for 30-60+ s after launch.
    wait_s: 90

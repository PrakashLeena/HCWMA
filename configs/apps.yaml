# Apps HCWMA may open (launch_app tool, T2; owner decision 2026-11-20, docs/DECISIONS.md).
# Only installed apps are opened, by their Start-menu entry; nothing is downloaded or installed.
# The owner can add apps here. Off-limits apps are dropped when this list is read, whatever
# is written here: web browsers, password managers, terminals / code editors / anything that
# runs commands, system security and settings, banking and payment apps, app stores and
# installers, and HCWMA itself (integrations/adapters/desktop/app_launch.py).
#
#   id             short name used in code
#   name, aliases  what the owner may call it ("open Calculator")
#   app_id_prefix  start of the AppUserModelID (Get-StartApps): package name + publisher id,
#                  so only the genuine app is opened, never a look-alike shortcut
#   processes      process names of a running copy (without .exe)
#   wait_s         how long to wait after opening it (default 30, at most 90); one attempt only
apps:
  - id: whatsapp
    name: WhatsApp
    aliases: [whatsapp desktop, whats app]
    app_id_prefix: 5319275A.WhatsAppDesktop_cv1g1gvanyjgm
    processes: [whatsapp.root, whatsapp]
    # Measured 2026-11-20 on this PC: WhatsApp shows its loading splash for 30-60+ s after launch.
    wait_s: 90
  - id: calculator
    name: Calculator
    aliases: [calc]
    app_id_prefix: Microsoft.WindowsCalculator_8wekyb3d8bbwe
    processes: [calculatorapp, calculator]
  - id: notepad
    name: Notepad
    aliases: []
    app_id_prefix: Microsoft.WindowsNotepad_8wekyb3d8bbwe
    processes: [notepad]

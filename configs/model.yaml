# HCWMA model — master document sections 5.4 and 5.5.
# Filled from docs/DECISIONS.md. Changing checkpoint or runtime is a change to this file only.
# Step 3 (2026-11-16): Ollama tag qwen3.5:4b confirmed = Q4_K_M, Apache 2.0, tools + vision.

checkpoint: Qwen3.5-4B
fallback_checkpoint: Qwen3.5-2B
runtime: ollama
ollama_model: qwen3.5:4b      # confirmed on ollama.com/library/qwen3.5 (Q4_K_M)
quantization: Q4_K_M
device: cpu                   # Intel Iris Xe, no NVIDIA GPU

endpoint:
  host: 127.0.0.1
  port: 11434                 # Ollama default

# Inference options (model/serving/).
context_length: 8192          # num_ctx; long prompts beyond this are truncated by Ollama
think: false                  # Qwen thinking mode off: keeps routing and tool calls fast on CPU
keep_alive: 30m               # how long Ollama keeps the model loaded after the last request
request_timeout_s: 600

# Owner decision 2026-11-20: when Ollama is down, HCWMA starts the installed `ollama serve`
# itself (hidden, OLLAMA_HOST=127.0.0.1:11434) with this models folder, and waits up to
# ollama_start_timeout_s for it to answer. Nothing is ever downloaded or installed.
ollama_models_dir: E:/ollama/models
ollama_start_timeout_s: 60

# One model instance, one request at a time (model_queue.py).
max_parallel_requests: 1

# Full safetensors copy, kept for research/source inspection only. Never loaded for serving.
research_checkpoint_dir: Qwen3.5-4B-Base

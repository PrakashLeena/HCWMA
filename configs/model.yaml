# HCWMA model — master document sections 5.4 and 5.5.
# Filled from docs/DECISIONS.md. Changing checkpoint or runtime is a change to this file only.
# Step 3 (2026-11-16): Ollama tag qwen3.5:4b confirmed = Q4_K_M, Apache 2.0, tools + vision.

checkpoint: Qwen3.5-4B
fallback_checkpoint: Qwen3.5-2B
runtime: ollama
# 2026-11-21 (docs/DECISIONS.md, docs/text_model.md): the daily model is a text-only tag made from
# qwen3.5:4b's own weights layer (same file, Q4_K_M, same renderer/parser), without the vision
# projector: ~1 GB less RAM, same speed, same routing score. Made by
# `python -m model.serving.text_model`. qwen3.5:4b stays installed; to switch back, use:
# ollama_model: qwen3.5:4b
ollama_model: qwen3.5-text:4b
quantization: Q4_K_M
device: cpu                   # Intel Iris Xe, no NVIDIA GPU

endpoint:
  host: 127.0.0.1
  port: 11434                 # Ollama default

# Inference options (model/serving/).
context_length: 8192          # num_ctx; long prompts beyond this are truncated by Ollama
think: false                  # Qwen thinking mode off: keeps routing and tool calls fast on CPU
keep_alive: 30m               # how long Ollama keeps the model loaded after the last request
request_timeout_s: 600

# Owner decision 2026-11-20: when Ollama is down, HCWMA starts the installed `ollama serve`
# itself (hidden, OLLAMA_HOST=127.0.0.1:11434) with this models folder, and waits up to
# ollama_start_timeout_s for it to answer. Nothing is ever downloaded or installed.
ollama_models_dir: E:/ollama/models
ollama_start_timeout_s: 60

# Backlog item 1 (2026-11-21, docs/DECISIONS.md, numbers in docs/ram_soak.md): keep the model's
# RAM bounded on a 16 GB PC. Measured: llama-server is ~5.0 GB private right after loading
# (Ollama loads with --load-mode none, so all weights are private, plus ~0.9 GB for the vision
# projector), +~0.5 GB for saved prompt states and context checkpoints, then flat (~5.5 GB).
# num_ctx is fixed (context_length) and Ollama already ran one slot (-np 1).
# Set on the `ollama serve` HCWMA starts itself (an Ollama started by its own tray app keeps
# its defaults; the idle RAM guard below covers that case too):
ollama_num_parallel: 1        # OLLAMA_NUM_PARALLEL: one slot, one KV cache (explicit, not auto)
prompt_cache_mb: 512          # LLAMA_ARG_CACHE_RAM: saved prompt states (default 8192 MiB)
context_checkpoints: 4        # LLAMA_ARG_CTX_CHECKPOINTS: per slot, ~50 MiB each (default 32)
# Idle RAM guard: when no model call ran for idle_unload_after_s and the model process holds
# more than idle_unload_ram_mb of private memory, HCWMA unloads it (Pause without pausing);
# the next request loads it again (~9 s). 0 turns the guard off.
idle_unload_ram_mb: 5300
idle_unload_after_s: 300

# One model instance, one request at a time (model_queue.py).
max_parallel_requests: 1

# Full safetensors copy, kept for research/source inspection only. Never loaded for serving.
research_checkpoint_dir: Qwen3.5-4B-Base
